[db_aa]
program_name = /vol/local/calarass/envs/phylophlan/bin/diamond
params = makedb
threads = --threads
input = --in
output = --db
version = version
command_line = #program_name# #params# #threads# #input# #output#

[map_aa]
program_name = /vol/local/calarass/envs/phylophlan/bin/diamond
params = blastp --quiet --threads 1 --outfmt 6 --more-sensitive --id 50 --max-hsps 35 -k 0
input = --query
database = --db
output = --out
version = version
command_line = #program_name# #params# #input# #database# #output#

[msa]
program_name = /vol/local/calarass/envs/phylophlan/bin/mafft
params = --quiet --anysymbol --thread 1 --auto
version = --version
command_line = #program_name# #params# #input# > #output#
environment = TMPDIR=/tmp

[trim]
program_name = /vol/local/calarass/envs/phylophlan/bin/trimal
params = -gappyout
input = -in
output = -out
version = --version
command_line = #program_name# #params# #input# #output#

[tree1]
program_name = /vol/local/calarass/envs/phylophlan/bin/iqtree
params = -quiet -T 12 -m LG+G4 -B 1000 --alrt 1000 --seed 12345 -o Kitasatospora_camelliae,Kitasatospora_cathayae,Kitasatospora_fiedleri,Kitasatospora_griseola,Kitasatospora_herbaricolor,Kitasatospora_hibisci,Kitasatospora_purpeofusca,Kitasatospora_setae_KM-6054,Peterkaempfera_bronchialis,Peterkaempfera_sp._SMS_15a
input = -s
output = -pre
version = -version
command_line = #program_name# #params# #input# #output#
