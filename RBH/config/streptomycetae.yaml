# Config for the reciprocal DIAMOND run against the Streptomyces reference
# organisms (S. coelicolor A3(2), S. venezuelae strain NRRL B-65442).
# Usage: python run_bidirectional_blast.py ../config/streptomycetae.yaml

# Paths without a leading / are relative to the repository root (resolved by the scripts).
# The reference proteomes are in RBH/data/strep_faa (README, Getting started, Step 2).

fasta_dir: RBH/data/arabinose_clusters
diamond_db: RBH/data/streptomycetae_protein_databa_db.dmnd
output_dir: RBH/results/diamond_reverseBLAST_streptomycetae

# Each query belongs to one of these reference organisms, identified by its
# query_file prefix (e.g. SCO* -> coelicolor, VNZ* -> venezuelae).
reference_proteomes:
  SCO: RBH/data/strep_faa/Streptomyces_coelicolor_A3(2)_protein.faa
  VNZ: RBH/data/strep_faa/Streptomyces_venezuelae_strain_NRRL_B-65442.faa

# Pre-built DIAMOND databases for the exact same proteomes above (built by
# make_databases_sterptomycetae.sh).
reference_dbs:
  SCO: RBH/results/databases/coelicolor_db.dmnd
  VNZ: RBH/results/databases/venezuelae_db.dmnd

threads: 12

fwd_evalue: 1.0e-5
fwd_id: 65
# per-query exceptions to fwd_id: SCO2402 hits next to confident SCO2401/SCO2403 hits fall
# below 65 % (synteny checks, synteny.ipynb), so its cutoff is lowered
fwd_id_per_query:
  SCO2402: 56
fwd_qcov: 70
fwd_scov: 70

rev_evalue: 1.0e-5
rev_max_targets: 5
# genome separator, if none then the in_paralogs are not filtered 
genome_sep: "|"
# true = reverse-check only the best forward hit per (query, genome); false = every hit
strict: false

self_id_min_pident: 98.0

# Presence/absence matrix (2_parse_diamond_make_presence_absence_matrix.py).
# species_list: one genome/species name per line - must match the "genome"
# column values in reciprocal_hits.tsv (i.e. the sseqid prefix before
# genome_sep) or that row is skipped with a warning.
species_list: RBH/data/strep_faa/species_list.txt
genes_of_interest:
  - SCO2401
  - SCO2402
  - SCO2403
  - SCO2407
  - SCO2440
  - SCO2439
  - vnz_RS33505
  - vnz_RS33510
  - vnz_RS33515
  - vnz_RS33520
presence_absence_matrix_name: presence_absence_matrix.csv
