# Config for the reciprocal DIAMOND run against the Streptomyces reference
# organisms (S. coelicolor A3(2), S. venezuelae strain NRRL B-65442).
# Usage: python run_bidirectional_blast.py ../config/streptomycetae.yaml

fasta_dir: /vol/local/calarass/Projects/ara_comp_genomics/data/arabinose_clusters
diamond_db: /vol/local/calarass/Projects/ara_comp_genomics/data/streptomycetae_protein_databa_db.dmnd
output_dir: /vol/local/calarass/Projects/ara_comp_genomics/results/diamond_reverseBLAST_streptomycetae

# Each query belongs to one of these reference organisms, identified by its
# query_file prefix (e.g. SCO* -> coelicolor, VNZ* -> venezuelae).
reference_proteomes:
  SCO: /vol/local/calarass/Projects/lipid_genomics/faa_files/Streptomyces_coelicolor_A3(2)_protein.faa
  VNZ: /vol/local/calarass/Projects/lipid_genomics/faa_files/Streptomyces_venezuelae_strain_NRRL_B-65442.faa

# Pre-built DIAMOND databases for the exact same proteomes above (built by
# run_streptomyceate.sh).
reference_dbs:
  SCO: /vol/local/calarass/Projects/ara_comp_genomics/results/databases/coelicolor_db.dmnd
  VNZ: /vol/local/calarass/Projects/ara_comp_genomics/results/databases/venezuelae_db.dmnd

threads: 12

fwd_evalue: 1.0e-5
fwd_id: 65
fwd_qcov: 70
fwd_scov: 70

rev_evalue: 1.0e-5
rev_max_targets: 5
genome_sep: null

self_id_min_pident: 98.0
